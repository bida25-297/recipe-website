    <main class="contact-page">
    <h1>Contact Us</h1>
    <p>Have a question or just want to say hello? We would love to hear from you. Fill in the form below and we will get back to you as soon as possible.</p>

    <form>
        <div>
            <label>Name:</label>
            <input type="text" placeholder="Enter your full name">
        </div>
        <div>
            <label>Email:</label>
            <input type="email" placeholder="Enter your email address">
        </div>
        <div>
            <label>Subject:</label>
            <input type="text" placeholder="What is this about?">
        </div>
        <div>
            <label>Message:</label>
            <textarea placeholder="Write your message here..."></textarea>
        </div>
        <button type="submit">Send Message</button>
    </form>
</main>

        <p>© 2026 Pancake Delight</p>
